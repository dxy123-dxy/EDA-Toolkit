[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-toolkit"
version = "0.1.0"
description = "Spatio-temporal exploratory data analysis and classic spatial statistics toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EDA Toolkit" }]
keywords = ["geospatial", "spatio-temporal", "eda", "spatial-statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "mapclassify>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "jsonschema>=4.20",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
raster = ["xarray>=2024.1", "rioxarray>=0.15", "rasterio>=1.3"]
spatial = ["libpysal>=4.9", "esda>=2.5", "pointpats>=2.4"]
kriging = ["pykrige>=1.7"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]
ui = ["streamlit>=1.32"]

[project.scripts]
steda = "eda_toolkit.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
